<!DOCTYPE html>
<html lang="en">

<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>
    <script>
        // 你的原始文本（带换行、带空格）
        let text = "你好\n你好    测试  哈哈";

        // 一键删除：所有空格 + 所有换行
        let result = text.replace(/\s+/g, '');

        console.log(result);
// 输出：你好你好测试哈哈

    </script>
</body>

</html>
